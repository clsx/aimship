name: Publish preview

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact preview tag (also select this tag as the workflow ref)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-preview-publication
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org

jobs:
  validate:
    if: github.repository == 'clsx/aimship'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0
          package-manager-cache: false
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - run: npm test
      - run: npm run check:docs
      - run: npm run check:package
      - run: git diff --check
      - run: node scripts/release-preview.mjs prepare "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: artifact
        with:
          name: preview-package
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0
          package-manager-cache: false
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          path: ${{ runner.temp }}/release/
          merge-multiple: true
      - run: node scripts/release-preview.mjs publish "$RUNNER_TEMP/release"
